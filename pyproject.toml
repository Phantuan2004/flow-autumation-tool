[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "flow-automation-tool"
version = "0.1.0"
description = "Desktop workflow tool for managing Veo 3 Flow video production batches."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "Pillow>=11.0",
    "playwright>=1.50",
    "pydantic>=2.10",
    "PyQt6>=6.8",
    "SQLAlchemy>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
]

[project.scripts]
flow-automation = "flow_automation.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

